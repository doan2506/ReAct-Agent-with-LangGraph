<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LangGraph ReAct Agent</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600&family=Inter:wght@300;400;500;600;700&family=Outfit:wght@500;600;700&display=swap" rel="stylesheet">
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <!-- Stylesheet -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body class="dark-theme">
    <div class="app-layout">
        <!-- HEADER NAVBAR -->
        <header class="app-header">
            <div class="brand">
                <div class="brand-icon">
                    <i class="fa-solid fa-robot"></i>
                </div>
                <div class="brand-text">
                    <h1>LangGraph <span>ReAct</span> Agent</h1>
                </div>
            </div>

            <div class="header-actions">
                <div class="model-picker">
                    <i class="fa-solid fa-microchip"></i>
                    <select id="modelSelect" class="form-control-sm">
                        <option value="google_genai/gemini-3.5-flash-lite" selected>Gemini 3.5 Flash Lite (Google)</option>
                        <option value="google_genai/gemini-flash-latest">Gemini Flash (Google)</option>
                        <option value="google_genai/gemma-4-31b-it">Gemma 4 31B (Google GenAI)</option>
                        <option value="google_genai/gemma-2-9b-it">Gemma 2 9B (Google GenAI)</option>
                        <option value="openai/gpt-4o-mini">GPT-4o Mini (OpenAI)</option>
                        <option value="anthropic/claude-3-5-sonnet-20241022">Claude 3.5 Sonnet (Anthropic)</option>
                    </select>
                </div>

                <div class="toggle-control">
                    <label class="switch">
                        <input type="checkbox" id="simToggle">
                        <span class="slider round"></span>
                    </label>
                    <span class="toggle-label"><i class="fa-solid fa-flask"></i> Demo Mode</span>
                </div>

                <div class="status-badge" id="statusBadge">
                    <span class="status-dot"></span>
                    <span class="status-text" id="statusText">Ready</span>
                </div>
            </div>
        </header>

        <!-- MAIN SINGLE-COLUMN WORKSPACE -->
        <main class="main-container simple-container">
            <!-- TRAJECTORY FEED STREAM -->
            <section class="card trajectory-card">
                <div class="card-header">
                    <h3><i class="fa-solid fa-comments"></i> Execution Stream</h3>
                    <button class="btn btn-outline" id="clearBtn"><i class="fa-solid fa-trash-can"></i> Clear</button>
                </div>

                <div class="trajectory-feed" id="trajectoryFeed">
                    <!-- Welcome Placeholder -->
                    <div class="empty-state" id="emptyState">
                        <div class="empty-icon"><i class="fa-solid fa-comments-sparkles"></i></div>
                        <h4>How can I help you today?</h4>
                        <p>Type a question or select a sample query below to run the ReAct agent.</p>
                    </div>
                </div>
            </section>

            <!-- PROMPT INPUT BAR -->
            <section class="card input-card">
                <div class="prompt-pills">
                    <span class="pill-label"><i class="fa-solid fa-wand-magic-sparkles"></i> Samples:</span>
                    <button class="pill-btn" data-prompt="Tổng hợp giúp tôi các email chưa đọc trong inbox">
                        <i class="fa-solid fa-envelope"></i> Tổng hợp email chưa đọc
                    </button>
                    <button class="pill-btn" data-prompt="Có email nào quan trọng hoặc cần xử lý gấp không?">
                        <i class="fa-solid fa-circle-exclamation"></i> Email cần xử lý gấp
                    </button>
                </div>

                <div class="input-form">
                    <textarea id="promptInput" class="prompt-input" rows="2" placeholder="Ask your agent anything... (e.g. 'Summarize my unread emails')"></textarea>
                    <button class="btn btn-primary" id="runBtn">
                        <i class="fa-solid fa-paper-plane"></i>
                        <span>Send</span>
                    </button>
                </div>
            </section>
        </main>
    </div>

    <!-- Hidden element for JavaScript compatibility -->
    <textarea id="systemPrompt" style="display: none;">You are an assistant that helps the user stay on top of their tasks and queries. Reason step-by-step and call tools when needed.</textarea>

    <!-- JavaScript -->
    <script src="{{ url_for('static', filename='js/app.js') }}"></script>
</body>
</html>
